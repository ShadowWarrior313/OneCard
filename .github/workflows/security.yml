name: Security Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    name: OneCard Security Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git secret scan

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.14.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security scanner
        run: npm run security-check
        continue-on-error: false

      - name: Report security check result
        if: always()
        run: |
          echo "### Security Check Status 🔐" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **PASS** - All security checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAIL** - Security check failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See the 'Run security scanner' step above for details." >> $GITHUB_STEP_SUMMARY
          fi

  security-tests:
    name: Security Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.14.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security tests
        run: npm run test -- stripe -- --reporter=verbose
        continue-on-error: false

      - name: Report test results
        if: always()
        run: |
          echo "### Security Test Results 🧪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **PASS** - All security tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAIL** - Security tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  git-secrets:
    name: Git Secrets Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          cd /tmp/git-secrets
          sudo make install

      - name: Configure git-secrets
        run: |
          git secrets --register-aws --global
          git secrets --add 'sk_live_' --global
          git secrets --add 'sk_test_' --global
          git secrets --add 'whsec_' --global

      - name: Scan for secrets in git history
        run: git secrets --scan

  envfile-check:
    name: Environment File Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .env files not committed
        run: |
          if git log --all --name-only --pretty=format: | grep -E '\.env(\.local)?$'; then
            echo "❌ ERROR: .env files found in git history"
            echo "These should be gitignored and never committed."
            exit 1
          else
            echo "✅ OK: No .env files in git history"
          fi

      - name: Verify .gitignore has .env entries
        run: |
          if grep -q '\.env' .gitignore; then
            echo "✅ OK: .env files are gitignored"
          else
            echo "❌ ERROR: .env files not in .gitignore"
            exit 1
          fi

  summary:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [security-check, security-tests, git-secrets, envfile-check]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "### OneCard Security Gate Summary 🔐" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scanner | ${{ needs.security-check.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ${{ needs.security-tests.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Secrets | ${{ needs.git-secrets.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| .env Files | ${{ needs.envfile-check.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.security-check.result }}" = "success" ] && [ "${{ needs.security-tests.result }}" = "success" ] && [ "${{ needs.git-secrets.result }}" = "success" ] && [ "${{ needs.envfile-check.result }}" = "success" ]; then
            echo "### 🎉 All Security Checks Passed!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### 🛑 Security Gate Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Fix the issues above before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Fail if any check failed
        if: |
          needs.security-check.result != 'success' ||
          needs.security-tests.result != 'success' ||
          needs.git-secrets.result != 'success' ||
          needs.envfile-check.result != 'success'
        run: exit 1
