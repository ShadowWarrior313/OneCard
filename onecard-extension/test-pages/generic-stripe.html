<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:site_name" content="Acme Checkout" />
    <title>Generic Stripe-style checkout</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Order",
        "seller": { "@type": "Organization", "name": "Acme Checkout" },
        "totalPrice": "42.00",
        "orderedItem": [
          { "@type": "Product", "name": "Digital starter kit", "price": "42.00" }
        ]
      }
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f6fbff, #e9eef6);
        color: #111318;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .checkout {
        width: min(520px, calc(100vw - 32px));
        background: #fff;
        border: 1px solid #dde5f0;
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(18, 28, 45, 0.12);
        padding: 30px;
      }

      h1 {
        margin: 0 0 8px;
      }

      .muted {
        color: #667085;
        margin: 0 0 24px;
      }

      label {
        display: grid;
        gap: 8px;
        margin: 14px 0;
        font-weight: 750;
      }

      input {
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        font: inherit;
        padding: 14px 16px;
      }

      .total {
        display: flex;
        justify-content: space-between;
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid #e5eaf2;
        font-size: 22px;
        font-weight: 900;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        margin-top: 20px;
        padding: 15px;
        background: #111318;
        color: #fff;
        font: inherit;
        font-weight: 850;
      }
    </style>
  </head>
  <body>
    <main class="checkout">
      <h1>Complete purchase</h1>
      <p class="muted">Generic test page for checkout detection fallback.</p>
      <div data-cart-item>
        <strong data-item-name>Digital starter kit</strong>
        <span data-item-price>$42.00</span>
      </div>
      <label>
        Card number
        <input autocomplete="cc-number" placeholder="4242 4242 4242 4242" />
      </label>
      <label>
        Expiration
        <input autocomplete="cc-exp" placeholder="MM / YY" />
      </label>
      <div class="total">
        <span>Amount due</span>
        <span data-order-total>$42.00</span>
      </div>
      <button type="button">Pay now</button>
    </main>
  </body>
</html>
